<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Preuzimanje</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1b1f24;--muted:#5b6470;--accent:#1f6feb;--ok:#1a7f37;--err:#cf222e;--line:#d0d7de}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161b22;--text:#e6edf3;--muted:#9aa4af;--accent:#2f81f7;--ok:#238636;--err:#f85149;--line:#30363d}}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 system-ui,Segoe UI,sans-serif}
main{max-width:480px;margin:64px auto;padding:0 16px}
.card{background:var(--card);border-radius:14px;padding:28px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
h1{margin:0 0 16px;font-size:24px}
input{box-sizing:border-box;width:100%;font-size:20px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);-webkit-text-security:disc}
button,a.dl{display:block;box-sizing:border-box;width:100%;margin-top:12px;border:0;background:var(--accent);color:#fff;font-weight:600;font-size:20px;padding:14px;border-radius:10px;cursor:pointer;text-align:center;text-decoration:none;font-family:inherit}
a.dl{background:var(--ok)}
.pkg{border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
.pkg b{font-size:19px}
#msg{min-height:24px;margin-top:12px;color:var(--muted)}
#msg.err{color:var(--err)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main><div class="card">
<h1>Preuzimanje</h1>
<div id="login">
<input id="pw" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Lozinka" aria-label="Lozinka">
<button id="go">Otključaj</button>
</div>
<div id="list" hidden></div>
<div id="msg"></div>
</div></main>
<script>
const $=id=>document.getElementById(id),pw=$('pw'),msg=$('msg');
let PASS='';
function say(t,e){msg.textContent=t;msg.className=e?'err':'';}
async function dec(file,pass){
  const buf=new Uint8Array(await (await fetch(file,{cache:'no-store'})).arrayBuffer());
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:buf.slice(0,16),iterations:600000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  return crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(16,28)},key,buf.slice(28));
}
async function unlock(){
  if(!pw.value){say('Upiši lozinku.',1);return;}
  say('Otključavam...');
  let lst;
  try{lst=JSON.parse(new TextDecoder().decode(await dec('paketi.bin',pw.value)));}
  catch(e){say('Pogrešna lozinka.',1);return;}
  PASS=pw.value;pw.value='';$('login').hidden=true;
  const L=$('list');L.innerHTML='';
  for(const p of lst){
    const d=document.createElement('div');d.className='pkg';
    const b=document.createElement('b');b.textContent=p.naziv;d.appendChild(b);
    const btn=document.createElement('button');btn.textContent='Pripremi';
    const a=document.createElement('a');a.className='dl';a.hidden=true;a.textContent='Spremi '+p.datoteka;a.download=p.datoteka;
    btn.onclick=async()=>{
      btn.disabled=true;btn.textContent='Pripremam...';
      try{
        const data=await dec(p.id+'.bin',PASS);
        a.href=URL.createObjectURL(new File([data],p.datoteka,{type:'application/octet-stream'}));
        btn.hidden=true;a.hidden=false;
      }catch(e){btn.disabled=false;btn.textContent='Pripremi';say('Greška, pokušaj ponovno.',1);}
    };
    d.append(btn,a);L.appendChild(d);
  }
  {const d=document.createElement('div');d.className='pkg';
   const b=document.createElement('b');b.textContent='Daljinski pristup (program, sam se ažurira)';d.appendChild(b);
   const a=document.createElement('a');a.className='dl';a.href='daljinski/Daljinski_Setup.exe';a.download='Daljinski_Setup.exe';a.textContent='Preuzmi instalaciju';
   d.appendChild(a);L.appendChild(d);}
  L.hidden=false;say('Odaberi što želiš preuzeti. ZIP raspakiraj (desni klik → Extract All) i pokreni.');
}
$('go').onclick=unlock;
pw.addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
</script>
</body>
</html>
